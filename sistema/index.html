h1,h2,h3{letter-spacing:-.02em}
main h2{font-size:var(--fs-xl);font-weight:700}
b,.k b,.vm,.rwtot{font-variant-numeric:tabular-nums}

/* botones */
button,.bt{border-radius:var(--r-md);transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .05s}
button:active:not(:disabled),.bt:active{transform:translateY(1px)}
button:focus-visible,.bt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid color-mix(in srgb,var(--ac) 70%,transparent);outline-offset:2px}
button.p{box-shadow:0 1px 2px rgba(0,16,188,.25)}
button.p:hover:not(:disabled){filter:brightness(1.06)}

/* campos */
input,select,textarea{background:var(--card);border-color:var(--bd);border-radius:var(--r-md);padding:9px 11px;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--mu) 45%,var(--bd))}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd));box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 12%,transparent);outline:none}
label{font-size:var(--fs-sm);font-weight:500;gap:5px}

/* tarjetas */
.box{border-radius:var(--r);padding:16px;box-shadow:var(--sh1);border-color:var(--bd)}
.k{border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh1);border-color:var(--bd)}
.k b{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em}
.vk .k{border-top-width:0;position:relative;overflow:hidden}
.vk .k::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.g{gap:12px}
.tile{border-radius:var(--r-lg);background:var(--card)!important;border:1px solid var(--bd)!important;box-shadow:var(--sh1)}
.tile:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--bd))!important;box-shadow:var(--sh2);transform:translateY(-1px)}
.tile .ti{border-radius:var(--r-lg)}
.chip{font-weight:600;letter-spacing:.01em}

td{border-bottom-color:var(--bd)}
.hero h1{font-weight:750}
.addbig{border-width:1.5px;font-size:var(--fs-base)}
.ttabs button,.ptabs button{border-radius:var(--r-md)}

/* ===== Sistema de diseño MST · ver DESIGN.md ===== */
:root{--ac:#0010bc;--act:#0010bc;--brand-ink:#020a14;--okf:#15803d;--ok:#15803d;--wa:#b45309;--er:#b91c1c;--info:#1d4ed8;--tx:#111827;--mu:#5b6472;--bd:#e6e8ec;--bg:#f4f5f7;--card:#fff;
 --fs-xs:12px;--fs-sm:13px;--fs-base:15px;--fs-md:16px;--fs-lg:18px;--fs-xl:22px;--fs-2xl:28px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-pill:999px;--r:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#4352f0;--act:#8a94ff;--ok:#22c55e;--wa:#f59e0b;--er:#f87171;--info:#60a5fa;--tx:#e8ecf2;--mu:#98a3b5;--bd:#262d38;--bg:#0f1318;--card:#171c23}}
:root[data-theme="dark"]{--ac:#4352f0;--act:#8a94ff;--ok:#22c55e;--wa:#f59e0b;--er:#f87171;--info:#60a5fa;--tx:#e8ecf2;--mu:#98a3b5;--bd:#262d38;--bg:#0f1318;--card:#171c23}
body{font-size:var(--fs-base)}
@media(max-width:760px){input,select,textarea{font-size:16px}}
.w{color:var(--wa)}.r{color:var(--er)}
/* botones: uno principal (azul MST) y uno de cobro (verde) */
button.p,.bt.p{background:var(--ac)!important;border-color:var(--ac)!important;color:#fff!important;background-image:none!important}
button.pay,#pos_pay,.posbar .pay{background:var(--okf)!important;border-color:var(--okf)!important;color:#fff!important;background-image:none!important;box-shadow:none!important}
button.pdfb{background:var(--card);border-color:color-mix(in srgb,var(--ac) 55%,var(--bd));color:var(--ac)}
/* pestañas: la activa en tinta neutra, igual en todos los módulos */
.ptabs button.on,.ptabs.subv button.on,.ptabs.suba button.on,.vform .ptabs button.on,.ftabs button.on,.pos .ptabs button.on{background:var(--tx)!important;border-color:var(--tx)!important;color:var(--card)!important;background-image:none!important}
.ptabs button.fcv.on{background:var(--okf)!important;border-color:var(--okf)!important;color:#fff!important}
.ptabs button.fpd.on{background:var(--wa)!important;border-color:var(--wa)!important;color:#fff!important}
/* "agregar nuevo": una sola caja en todos los módulos */
.addbig,.addbig.mini,.addbig.rwbig,.addbig.snb{border:2px dashed color-mix(in srgb,var(--ac) 70%,var(--bd))!important;color:var(--ac)!important;background:color-mix(in srgb,var(--ac) 5%,var(--card))!important}
.addbig span,.addbig.mini span,.addbig.rwbig span,.addbig.snb span{background:var(--ac)!important;color:#fff!important}
.addbig:hover{background:color-mix(in srgb,var(--ac) 10%,var(--card))!important}
/* indicadores: barra superior en el color de la línea */
.k,.vk .k{border:1px solid var(--bd)!important;border-top:3px solid var(--c,var(--bd))!important;border-radius:var(--r-lg)!important;box-shadow:var(--sh1)}
.k span,.vk .k span,.hpk small,.rk small,.rsk small,.pgin small,.chdat small,.ivc small{text-transform:none!important;letter-spacing:0!important;font-weight:600}

.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}

.chip.mid{background:color-mix(in srgb,#a16207 16%,transparent);color:#a16207}

.poshv small,.posht small{color:var(--mu)!important}

/* ---------- Clave de acceso ---------- */
const PIN_ON=false; /* clave de acceso desactivada por ahora; cambiar a true para activarla */
const PIN_IDLE=15*60e3;
let pinDoc=null,locked=true,lastAct=Date.now(),pinTries=0,pinLockUntil=0;
async function pbk(pin,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:600000,hash:"SHA-256"},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const pinNeedsNew=()=>!pinDoc||!pinDoc.h||(MEU&&MEU.pinReset&&String(pinDoc.set||"")<String(MEU.pinReset));
async function pinStep(){const b=$("#go"),z=$("#pinz");if(!UID||!ROL||!z)return;if(!PIN_ON){unlock();return}if(b){b.disabled=true;b.textContent="Verificando…"}
 try{const d=await db.collection("pins").doc(UID).get();pinDoc=d.exists?d.data():null}
 catch(e){if(b){b.disabled=false;b.textContent="Reintentar"}z.innerHTML='<p class="pinerr">No se pudo verificar tu clave. Revisa tu conexión y vuelve a intentar.</p>';return}
 if(b)b.hidden=true;z.innerHTML=pinBox(pinNeedsNew()?"new":"enter");pinWire(z)}
function pinBox(mode){const nw=mode=="new";
 return `<form class="pinf" id="pinform" data-mode="${mode}" autocomplete="off">
 <b style="text-align:center">${nw?(pinDoc?"Crea una clave nueva":"Crea tu clave de acceso"):"Ingresa tu clave"}</b>
 ${nw?'<small style="color:var(--mu);text-align:center">De 4 a 6 números. La pediremos cada vez que entres y después de 15 minutos sin uso.</small>':""}
 <label for="pin1" style="text-align:center">${nw?"Clave nueva":"Clave"}<input id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="${nw?"new-password":"current-password"}" aria-label="Clave"></label>
 ${nw?'<label for="pin2" style="text-align:center">Repite la clave<input id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" aria-label="Repetir clave"></label>':""}
 <p class="pinerr" id="pinerr" role="alert"></p>
 <button class="p" type="submit">${nw?"Guardar clave y entrar":"Entrar"}</button>
 ${nw?"":'<button type="button" class="lnk2" onclick="pinHelp(this)">¿Olvidaste tu clave?</button>'}</form>`}
function pinHelp(b){const h=document.createElement("div");h.className="pinhelp";h.innerHTML=OWNER?"Eres el dueño del sistema. Pídele a Claude, en el chat donde creaste el sistema, que borre tu clave del sistema MST. Después podrás crear una nueva.":"Pídele al administrador que toque <b>Restablecer clave</b> en tu ficha de Usuarios. Después podrás crear una clave nueva aquí.";b.replaceWith(h)}
function pinWire(root){const f=root.querySelector("#pinform");if(!f)return;const i1=f.querySelector("#pin1");setTimeout(()=>{try{i1.focus()}catch(e){}},30);
 f.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{i.value=i.value.replace(/\D/g,"").slice(0,6)}));
 f.onsubmit=async ev=>{ev.preventDefault();const err=f.querySelector("#pinerr"),bt=f.querySelector("button.p"),p1=i1.value;
  if(f.dataset.mode=="new"){const p2=f.querySelector("#pin2").value;
   if(!/^\d{4,6}$/.test(p1)){err.textContent="La clave debe tener entre 4 y 6 números.";return}
   if(/^(\d)\1+$/.test(p1)||"0123456789".includes(p1)||"9876543210".includes(p1)){err.textContent="Esa clave es muy fácil de adivinar. Elige otra.";return}
   if(p1!==p2){err.textContent="Las dos claves no coinciden.";return}
   bt.disabled=true;bt.textContent="Guardando…";
   try{const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,"0")).join(""),doc={h:await pbk(p1,salt),s:salt,v:2,set:new Date().toISOString()};await db.collection("pins").doc(UID).set(doc);pinDoc=doc;unlock()}
   catch(e){bt.disabled=false;bt.textContent="Guardar clave y entrar";err.textContent="No se pudo guardar la clave. Revisa tu conexión y vuelve a intentar."}
   return}
  if(Date.now()<pinLockUntil){err.textContent="Demasiados intentos. Espera "+Math.ceil((pinLockUntil-Date.now())/60e3)+" min y vuelve a intentar.";return}
  if(!/^\d{4,6}$/.test(p1)){err.textContent="Escribe tu clave de 4 a 6 números.";return}
  bt.disabled=true;const ok=pinDoc&&(pinDoc.v==2?await pbk(p1,pinDoc.s):await sha(pinDoc.s+":"+p1))===pinDoc.h;bt.disabled=false;
  if(ok){pinTries=0;unlock();return}
  pinTries++;i1.value="";i1.focus();
